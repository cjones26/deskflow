name: Local Linux Build

on:
  push:
    branches:
      - agent/fix-wayland-locked-modifiers
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    container: debian:trixie-slim

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          apt update -qqq > /dev/null
          apt install -qqq -y \
            git cmake build-essential ninja-build \
            xorg-dev libx11-dev libxtst-dev libssl-dev \
            libxkbfile-dev qt6-base-dev qt6-tools-dev libxkbcommon-dev \
            libei-dev libportal-dev help2man > /dev/null

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSKIP_BUILD_TESTS=ON

      - name: Build core
        run: cmake --build build --target deskflow-core -j2
