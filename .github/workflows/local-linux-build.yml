name: Local Linux Build

on:
  push:
    branches:
      - agent/fix-wayland-locked-modifiers
  workflow_dispatch:

jobs:
  native-core:
    runs-on: ubuntu-latest
    container: debian:trixie-slim

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          apt update -qqq > /dev/null
          apt install -qqq -y \
            git cmake build-essential ninja-build \
            xorg-dev libx11-dev libxtst-dev libssl-dev \
            libxkbfile-dev qt6-base-dev qt6-tools-dev libxkbcommon-dev \
            libei-dev libportal-dev help2man > /dev/null

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSKIP_BUILD_TESTS=ON

      - name: Build core
        run: cmake --build build --target deskflow-core -j2

  flatpak-bundle:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install flatpak builder
        run: |
          sudo apt update -qqq > /dev/null
          sudo apt install -qqq -y flatpak flatpak-builder > /dev/null
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.kde.Platform//6.10 org.kde.Sdk//6.10

      - name: Build Flatpak repo
        run: |
          flatpak-builder --force-clean --repo=repo build-dir deploy/linux/flatpak/org.deskflow.deskflow.yml

      - name: Create Flatpak bundle
        run: |
          flatpak build-bundle repo deskflow-wayland-locked-modifiers.flatpak org.deskflow.deskflow stable

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v6
        with:
          name: deskflow-wayland-locked-modifiers-flatpak
          path: deskflow-wayland-locked-modifiers.flatpak
          if-no-files-found: error
